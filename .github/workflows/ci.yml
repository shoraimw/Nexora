name: Nexora quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Contract tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Preview-mode HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3077 > /tmp/nexora-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:3077/api/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          node -e 'const h=require("/tmp/health.json");if(h.mode!=="preview"||h.checkoutEnabled)process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3077/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3077/shop)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3077/product/aero-buds)" = "200"
          for route in /cart /account /track /offers /contact /policies /admin /category/pc-accessories/desk-setup; do
            status="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3077$route")"
            test "$status" = "200" || { echo "Route $route returned $status"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3077/api/orders)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3077/api/account/delete)" = "503"
          curl -fsS -X POST -H 'Origin: http://127.0.0.1:3077' -H 'Content-Type: application/json' --data '{"message":"earbuds"}' http://127.0.0.1:3077/api/chat >/tmp/chat-same-origin.json
          node -e 'const c=require("/tmp/chat-same-origin.json");if(c.live!==false||!c.answer)process.exit(1)'
          status="$(curl -s -o /tmp/chat-cross-origin.json -w '%{http_code}' -X POST -H 'Origin: https://attacker.example' -H 'Content-Type: application/json' --data '{"message":"earbuds"}' http://127.0.0.1:3077/api/chat)"
          test "$status" = "403"
          curl -fsS http://127.0.0.1:3077/api/newsletter >/tmp/newsletter.json
          node -e 'const n=require("/tmp/newsletter.json");if(n.available!==false)process.exit(1)'
          curl -fsS http://127.0.0.1:3077/api/categories >/tmp/categories.json
          node -e 'const c=require("/tmp/categories.json");if(c.live!==false)process.exit(1)'
          echo "Customer routes are readable; account deletion, newsletter collection and payment submission remain safely disabled in preview."
      - name: Install Playwright for visual QA
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture five responsive viewports and shopping journeys
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3078 > /tmp/nexora-visual.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:3078/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python scripts/shoot.py http://127.0.0.1:3078 shots/ --wait 2.5 --full
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-visual-review
          path: shots/
          if-no-files-found: warn
          retention-days: 7
